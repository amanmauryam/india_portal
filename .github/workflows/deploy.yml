name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.61.237.124
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /root/deploy.sh
